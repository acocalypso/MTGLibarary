[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-cards"
version = "0.1.0"
description = "Desktop MTG collection manager"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.10.1",
  "requests>=2.32.5",
  "ijson>=3.4.0.post0",
  "packaging>=25.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
